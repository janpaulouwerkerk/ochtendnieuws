name: Controleer dagelijkse nieuwsgeneratie

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controleer echte bronnen en model zonder de editie te vervangen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import json
          import subprocess

          path = Path('public/data/editions.json')
          original = path.read_bytes()
          result = subprocess.run(
              ['python', 'scripts/update_news.py', '--force', '--dry-run'],
              capture_output=True, text=True,
          )
          print(result.stderr)
          assert path.read_bytes() == original, 'De controle heeft de opgeslagen editie gewijzigd.'
          assert result.returncode == 0, 'De dagelijkse generatie is niet geslaagd.'
          document = json.loads(result.stdout)
          today = datetime.now(ZoneInfo('Europe/Amsterdam')).date().isoformat()
          edition = next(e for e in document['editions'] if e['date'] == today)
          articles = edition['articles']
          assert len(articles) == 5, 'De editie bevat niet exact vijf artikelen.'
          assert len({a['id'] for a in articles}) == 5, 'Herhaalde artikel-id.'
          assert len({a['source']['url'] for a in articles}) == 5, 'Herhaalde bron-URL.'
          assert document['sourceNote'].startswith('AI-samenvattingen'), (
              'De bronfallback werkt, maar modeltoegang is nog niet bevestigd. Zie de log hierboven.'
          )
          print(f'Geslaagd: vijf AI-samenvattingen voor {today}; de bestaande editie is behouden.')
          PY
